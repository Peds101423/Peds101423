        let currentQuestionIndex = 0;
        let score = 0;
        let questionState = 'unanswered'; // 'unanswered', 'answered'

        // DOM Elements
        const startScreen = document.getElementById('start-screen');
        const quizContainer = document.getElementById('quiz-container');
        const resultsScreen = document.getElementById('results-screen');
        const questionText = document.getElementById('question-text');
        const optionsContainer = document.getElementById('options-container');
        const feedbackSection = document.getElementById('feedback-section');
        const feedbackTitle = document.getElementById('feedback-title');
        const feedbackText = document.getElementById('feedback-text');
        const feedbackIcon = document.getElementById('feedback-icon');
        const nextBtn = document.getElementById('next-btn');
        const questionCounter = document.getElementById('question-counter');
        const progressBar = document.getElementById('progress-bar');
        const currentScoreEl = document.getElementById('current-score');
        const scoreDisplay = document.getElementById('score-display');
        const hintText = document.getElementById('hint-text');

        function startQuiz() {
            startScreen.classList.add('hidden');
            quizContainer.classList.remove('hidden');
            scoreDisplay.classList.remove('hidden');
            loadQuestion();
        }

        function loadQuestion() {
            const question = quizData[currentQuestionIndex];
            
            // Reset UI
            questionState = 'unanswered';
            questionText.textContent = `${question.questionNumber}. ${question.question}`;
            optionsContainer.innerHTML = '';
            feedbackSection.classList.add('hidden');
            hintText.classList.add('hidden');
            nextBtn.disabled = true;
            nextBtn.innerHTML = `Next <i class="fas fa-chevron-right ml-1"></i>`;
            
            // Update Progress
            questionCounter.textContent = `Question ${currentQuestionIndex + 1} of ${quizData.length}`;
            const progress = ((currentQuestionIndex) / quizData.length) * 100;
            progressBar.style.width = `${progress}%`;

            // Render Options
            question.answerOptions.forEach((option, index) => {
                const button = document.createElement('button');
                button.className = `w-full text-left p-4 rounded-lg border border-gray-200 hover:bg-blue-50 hover:border-blue-300 transition duration-200 flex items-center justify-between group`;
                button.innerHTML = `
                    <span class="font-medium text-gray-700 group-hover:text-blue-700">${option.text}</span>
                    <i class="far fa-circle text-gray-400 group-hover:text-blue-400"></i>
                `;
                button.onclick = () => selectAnswer(index, button);
                optionsContainer.appendChild(button);
            });
        }

        function selectAnswer(selectedIndex, button) {
            if (questionState === 'answered') return;
            questionState = 'answered';

            const question = quizData[currentQuestionIndex];
            const selectedOption = question.answerOptions[selectedIndex];
            const buttons = optionsContainer.children;

            // Highlight chosen answer
            if (selectedOption.isCorrect) {
                score++;
                currentScoreEl.textContent = score;
                button.classList.add('correct-answer');
                button.querySelector('i').className = 'fas fa-check-circle text-green-600';
                showFeedback(true, selectedOption.rationale);
            } else {
                button.classList.add('wrong-answer');
                button.querySelector('i').className = 'fas fa-times-circle text-red-600';
                
                // Find and highlight correct answer
                const correctIndex = question.answerOptions.findIndex(o => o.isCorrect);
                const correctButton = buttons[correctIndex];
                correctButton.classList.add('correct-answer');
                correctButton.querySelector('i').className = 'fas fa-check-circle text-green-600';
                
                showFeedback(false, selectedOption.rationale); // Or show general rationale if preferred
            }

            // Disable all buttons
            for (let btn of buttons) {
                btn.disabled = true;
                btn.classList.remove('hover:bg-blue-50', 'hover:border-blue-300');
                if (!btn.classList.contains('correct-answer') && !btn.classList.contains('wrong-answer')) {
                    btn.classList.add('opacity-60');
                }
            }

            // Prepare Next Button
            nextBtn.disabled = false;
            if (currentQuestionIndex === quizData.length - 1) {
                nextBtn.innerHTML = `Finish <i class="fas fa-flag-checkered ml-1"></i>`;
            }
        }

        function showFeedback(isCorrect, rationale) {
            feedbackSection.classList.remove('hidden');
            feedbackSection.classList.remove('bg-blue-50', 'border-blue-100', 'bg-red-50', 'border-red-100', 'bg-green-50', 'border-green-100');
            
            if (isCorrect) {
                feedbackSection.classList.add('bg-green-50', 'border-green-100');
                feedbackTitle.textContent = "Correct!";
                feedbackTitle.className = "text-sm font-bold text-green-800 mb-1";
                feedbackText.className = "text-sm text-green-700";
                feedbackIcon.className = "fas fa-check-circle text-green-500";
            } else {
                feedbackSection.classList.add('bg-red-50', 'border-red-100');
                feedbackTitle.textContent = "Incorrect";
                feedbackTitle.className = "text-sm font-bold text-red-800 mb-1";
                feedbackText.className = "text-sm text-red-700";
                feedbackIcon.className = "fas fa-times-circle text-red-500";
            }
            
            // Always show the correct rationale
            const question = quizData[currentQuestionIndex];
            const correctOption = question.answerOptions.find(o => o.isCorrect);
            // Use the rationale from the selected option if it exists, otherwise fallback to correct option rationale
            feedbackText.textContent = rationale || correctOption.rationale; 
            
            // Inject Hint text into hidden p tag
            hintText.textContent = `Hint: ${question.hint}`;
        }

        function toggleHint() {
            hintText.classList.toggle('hidden');
        }

        function nextQuestion() {
            if (currentQuestionIndex < quizData.length - 1) {
                currentQuestionIndex++;
                loadQuestion();
            } else {
                showResults();
            }
        }

        function showResults() {
            quizContainer.classList.add('hidden');
            resultsScreen.classList.remove('hidden');
            scoreDisplay.classList.add('hidden');
            progressBar.style.width = '100%';

            const percentage = Math.round((score / quizData.length) * 100);
            document.getElementById('final-score-percent').textContent = `${percentage}%`;
            document.getElementById('total-correct').textContent = score;
            document.getElementById('total-wrong').textContent = quizData.length - score;

            // Animate Circle
            const circle = document.getElementById('score-circle');
            const radius = circle.r.baseVal.value;
            const circumference = radius * 2 * Math.PI;
            const offset = circumference - (percentage / 100) * circumference;
            circle.style.strokeDashoffset = offset;

            // Message
            const msgEl = document.getElementById('final-message');
            if (percentage >= 90) msgEl.textContent = "Outstanding! You're an expert.";
            else if (percentage >= 70) msgEl.textContent = "Great job! You passed with flying colors.";
            else if (percentage >= 50) msgEl.textContent = "Good effort. Keep reviewing!";
            else msgEl.textContent = "Keep practicing, you'll get there!";
        }

        function restartQuiz() {
            currentQuestionIndex = 0;
            score = 0;
            currentScoreEl.textContent = 0;
            resultsScreen.classList.add('hidden');
            quizContainer.classList.remove('hidden');
            scoreDisplay.classList.remove('hidden');
            loadQuestion();
        }

        async function shareScore() {
            const percentage = Math.round((score / quizData.length) * 100);
            const text = `I scored ${percentage}% (${score}/${quizData.length}) on the Electronics Systems Quiz!`;
            
            // Try using the Web Share API first (for mobile/chat apps)
            if (navigator.share) {
                try {
                    await navigator.share({
                        title: 'ESAT Quiz Score',
                        text: text,
                    });
                    return; // If successful, stop here
                } catch (err) {
                    // User cancelled or share failed, fall back to clipboard
                    console.log('Share failed, falling back to clipboard', err);
                }
            }

            // Fallback: Copy to clipboard
            const tempInput = document.createElement("textarea");
            tempInput.value = text;
            document.body.appendChild(tempInput);
            tempInput.select();
            document.execCommand("copy");
            document.body.removeChild(tempInput);

            // Show feedback
            const feedback = document.getElementById('copy-feedback');
            feedback.classList.remove('hidden');
            setTimeout(() => {
                feedback.classList.add('hidden');
            }, 2000);
        }
    </script>
